name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lightweight dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m pytest
      - name: Rebuild tracked figure gallery
        run: python scripts/build_figures.py
