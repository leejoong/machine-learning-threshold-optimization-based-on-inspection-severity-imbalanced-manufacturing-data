[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "manufacturing-risk-threshold-policy"
version = "0.1.0"
description = "Reproducible risk-based inspection threshold experiments for imbalanced manufacturing data."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy==2.1.3",
    "pandas==2.2.3",
    "scipy==1.14.1",
    "scikit-learn==1.5.2",
    "matplotlib==3.9.0",
    "seaborn==0.13.2",
    "pyarrow==16.1.0",
    "joblib==1.4.2",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5"]
experiments = [
    "xgboost==2.1.1",
    "lightgbm==4.6.0",
    "catboost==1.2.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
